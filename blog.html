<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Notes | Nandini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body { background-color: #000000; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .spotlight {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, rgba(0, 0, 0, 0) 50%);
            z-index: -1; pointer-events: none;
        }

        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .prose h2 { font-size: 1.8rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #fff; }
        .prose h3 { font-size: 1.4rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #e5e7eb; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #d1d5db; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; color: #d1d5db; }
        .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; font-style: italic; color: #9ca3af; margin: 1.5rem 0; }
        .prose code { background: rgba(59, 130, 246, 0.1); color: #60a5fa; padding: 2px 6px; rounded: 4px; font-family: monospace; }

        .active-post { 
            background: rgba(59, 130, 246, 0.15); 
            border-left: 3px solid #3b82f6; 
            color: #60a5fa; 
        }

        /* --- ANIMATIONS --- */

        /* 1. Falling In (Stacking) */
        @keyframes fall-stack {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translateY(0) rotate(var(--rot)); opacity: 1; }
            90% { transform: translateY(-10px) rotate(var(--rot)); } 
            100% { transform: translateY(0) rotate(var(--final-rot)); opacity: 0.8; }
        }

        /* 2. Falling OUT (Reset/Flush) */
        @keyframes fall-out {
            0% { transform: translateY(0) rotate(var(--final-rot)); opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(180deg); opacity: 0; }
        }

        .falling-icon {
            position: absolute;
            bottom: var(--bottom-pos);
            left: var(--left-pos);
            font-size: var(--size);
            color: var(--color);
            opacity: 0;
            animation: fall-stack 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: var(--delay);
            pointer-events: none;
            z-index: 0; 
            filter: drop-shadow(0 0 5px currentColor);
        }

        /* Class added via JS when resetting */
        .flushing-icon {
            animation: fall-out 1s ease-in forwards !important;
        }

        /* 3. Blog Entry Slide Up */
        @keyframes slide-up-fade {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-entry {
            animation: slide-up-fade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div class="spotlight"></div>

    <nav class="w-full bg-[#000000] border-b border-white/10 z-50 flex-none">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold hover:opacity-80 transition">
                <i class="fa-solid fa-arrow-left mr-2 text-sm text-gray-500"></i> <span class="text-blue-500">N</span>andini.
            </a>
            <div class="text-xs font-mono text-gray-500">RESEARCH LOG_V1.0</div>
        </div>
    </nav>

    <div class="flex flex-1 max-w-7xl mx-auto w-full overflow-hidden">
        
        <aside class="w-full md:w-80 border-r border-white/10 bg-[#0a0a0a] flex flex-col md:flex hidden md:block relative overflow-hidden">
            
            <div id="sidebar-spill" class="absolute inset-0 w-full h-full pointer-events-none z-0"></div>

            <div class="p-6 border-b border-white/10 relative z-10 bg-[#0a0a0a]/90 backdrop-blur-sm">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Index</h3>
            </div>
            
            <div class="sidebar-scroll overflow-y-auto flex-1 p-4 space-y-2 relative z-10" id="post-list">
                </div>
        </aside>

        <main class="flex-1 overflow-y-auto relative bg-[#000000] p-6 md:p-12 scroll-smooth" id="main-scroll">
            
            <div class="md:hidden mb-8">
                <select onchange="loadPost(this.value)" id="mobile-select" class="w-full bg-[#111] border border-gray-700 text-white p-3 rounded-lg">
                </select>
            </div>

            <div class="max-w-3xl mx-auto pt-4 pb-20 prose" id="post-content">
            </div>

            <div class="max-w-3xl mx-auto border-t border-white/10 pt-8 mt-20 text-center text-sm text-gray-600">
                End of entry.
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        const posts = [
            {
                id: 1,
                title: "Scaling Histopathology AI",
                date: "Feb 06, 2026",
                category: "Pathology",
                content: `
                    <span class="text-blue-500 font-mono text-xs mb-4 block">PATHOLOGY • 8 MIN READ</span>
                    <h1 class="text-4xl font-bold mb-6 text-white leading-tight">Scaling Histopathology AI in Clinical Workflows</h1>
                    <p class="text-xl text-gray-300 mb-8 leading-relaxed">Analyzing the bottlenecks of integrating Deep Learning models into hospital LIS systems and solving the "Ground Truth" problem.</p>
                    
                    <h2>The "Ground Truth" Problem</h2>
                    <p>One of the biggest hurdles in training models for pathology is the disagreement rate between human experts. Unlike a cat vs. dog classifier, identifying the exact grade of a tumor is subjective.</p>
                    <blockquote>"If two pathologists disagree 30% of the time, what is the model actually learning?"</blockquote>
                    <p>To solve this, we implemented a <strong>Consensus-Based Labeling Pipeline</strong>. We aggregate annotations from three different sub-specialists and use a weighted voting system to determine the ground truth mask for training our CNNs.</p>
                `
            },
            {
                id: 2,
                title: "Python vs R in Biotech",
                date: "Jan 12, 2026",
                category: "Tech Stack",
                content: `
                    <span class="text-purple-500 font-mono text-xs mb-4 block">TECH STACK • 5 MIN READ</span>
                    <h1 class="text-4xl font-bold mb-6 text-white leading-tight">Why Python Won the Biotech War</h1>
                    <p class="text-xl text-gray-300 mb-8 leading-relaxed">R is fantastic for statistics, but Python is the language of production engineering. Here is why the shift happened.</p>
                    
                    <h2>The Deep Learning Factor</h2>
                    <p>While R has interfaces for Keras, the native support for <code>PyTorch</code> and <code>TensorFlow</code> in Python makes it the default choice for modern computational biology.</p>
                `
            },
            {
                id: 3,
                title: "Building Medical APIs",
                date: "Dec 20, 2025",
                category: "Engineering",
                content: `
                    <span class="text-green-500 font-mono text-xs mb-4 block">ENGINEERING • 6 MIN READ</span>
                    <h1 class="text-4xl font-bold mb-6 text-white leading-tight">HIPAA Compliance in API Design</h1>
                    <p class="text-xl text-gray-300 mb-8 leading-relaxed">How to architect a REST API that handles sensitive patient data without violating privacy laws.</p>
                    
                    <h2>Encryption Everywhere</h2>
                    <p>It is not enough to encrypt data at rest. You must ensure TLS 1.3 is enforced for all data in transit.</p>
                `
            }
        ];

        let pileHeight = 0; // Tracks current height

        function initBlog() {
            const listContainer = document.getElementById('post-list');
            const mobileSelect = document.getElementById('mobile-select');
            
            posts.forEach((post, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg transition-all duration-200 hover:bg-white/10 mb-1 group ${index === 0 ? 'active-post' : 'text-gray-400'}`;
                btn.onclick = () => loadPost(post.id);
                btn.id = `btn-${post.id}`;
                btn.innerHTML = `
                    <div class="text-[10px] font-mono opacity-50 mb-1 group-hover:text-blue-400">${post.date}</div>
                    <div class="font-bold text-sm leading-tight">${post.title}</div>
                `;
                listContainer.appendChild(btn);

                const opt = document.createElement('option');
                opt.value = post.id;
                opt.text = post.title;
                mobileSelect.appendChild(opt);
            });

            loadPost(posts[0].id);
        }

        function loadPost(id) {
            const post = posts.find(p => p.id == id);
            const contentArea = document.getElementById('post-content');
            
            contentArea.classList.remove('animate-entry');
            contentArea.style.opacity = '0';

            setTimeout(() => {
                contentArea.innerHTML = post.content;
                contentArea.classList.add('animate-entry');
                document.getElementById('main-scroll').scrollTop = 0;
            }, 50);

            document.querySelectorAll('#post-list button').forEach(b => {
                b.classList.remove('active-post', 'text-blue-500');
                b.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`btn-${id}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('active-post');
            }
            document.getElementById('mobile-select').value = id;

            // Trigger Icons
            triggerSmartSpill();
        }

        // --- INTELLIGENT FILL & FLUSH LOGIC ---
        function triggerSmartSpill() {
            const container = document.getElementById('sidebar-spill');
            const icons = ['fa-dna', 'fa-microchip', 'fa-flask', 'fa-code', 'fa-brain', 'fa-file-code', 'fa-vial'];
            const colors = ['#60a5fa', '#a78bfa', '#34d399', '#f472b6', '#22d3ee'];

            const viewportHeight = window.innerHeight;

            // 1. CHECK IF FULL (Reset if > 90% of screen)
            if (pileHeight > (viewportHeight * 0.9)) {
                flushIcons();
                return; // Stop here, let the flush happen first
            }

            // 2. ADD NEW ICONS
            // Add 15 new icons per click
            for(let i=0; i<15; i++) {
                const icon = document.createElement('i');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                
                icon.classList.add('fa-solid', randomIcon, 'falling-icon');
                
                // Random position
                const leftPos = Math.floor(Math.random() * 85) + '%'; 
                
                // Height logic: Stack on top of current pile
                const floor = pileHeight; 
                const ceiling = pileHeight + 100; // Add 100px range
                const bottomPos = Math.floor(Math.random() * (ceiling - floor) + floor) + 'px';

                const delay = (Math.random() * 0.5) + 's'; 
                const size = Math.floor(Math.random() * 20 + 12) + 'px'; 
                const rotation = Math.floor(Math.random() * 360) + 'deg';
                const color = colors[Math.floor(Math.random() * colors.length)];

                icon.style.setProperty('--left-pos', leftPos);
                icon.style.setProperty('--bottom-pos', bottomPos);
                icon.style.setProperty('--delay', delay);
                icon.style.setProperty('--size', size);
                icon.style.setProperty('--rot', rotation);
                icon.style.setProperty('--final-rot', Math.floor(Math.random() * 360) + 'deg');
                icon.style.setProperty('--color', color);
                
                container.appendChild(icon);
            }

            // Increase pile height for next time
            pileHeight += 80; 
        }

        function flushIcons() {
            const allIcons = document.querySelectorAll('.falling-icon');
            
            // Apply flush animation to all existing icons
            allIcons.forEach(icon => {
                // Random delay for natural "collapse" feel
                icon.style.animationDelay = (Math.random() * 0.3) + 's';
                icon.classList.add('flushing-icon');
            });

            // Cleanup DOM after animation completes
            setTimeout(() => {
                const container = document.getElementById('sidebar-spill');
                container.innerHTML = ''; // Wipe clean
                pileHeight = 0; // Reset counter
                
                // Optional: Start fresh batch immediately after flush
                triggerSmartSpill(); 
            }, 1200);
        }

        initBlog();

    </script>
</body>
</html>
